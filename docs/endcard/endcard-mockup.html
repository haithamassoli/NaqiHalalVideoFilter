body{font-family:var(--font-sans);color:var(--foreground)}
.wrap{display:flex;flex-direction:column;gap:14px}
.stage{display:flex;gap:16px;align-items:flex-end;justify-content:center;flex-wrap:wrap;direction:ltr}
.frame{display:flex;flex-direction:column;align-items:center;gap:6px}
canvas{border-radius:var(--radius);display:block;box-shadow:0 0 0 1px var(--border)}
#portrait{width:200px;height:356px}
#landscape{width:400px;height:225px}
.cap{font-size:12px;color:var(--muted-foreground)}
.bar{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
button{font:inherit;font-size:13px;padding:7px 14px;border-radius:var(--radius);border:1px solid var(--border);background:var(--secondary);color:var(--secondary-foreground);cursor:pointer}
button.primary{background:var(--primary);color:var(--primary-foreground);border-color:transparent}
button[aria-pressed=true]{background:var(--accent-surface);color:var(--accent-surface-foreground)}
input[type=range]{width:220px;direction:ltr}
.t{font-family:var(--font-mono);font-size:12px;color:var(--muted-foreground);min-width:56px;text-align:center;direction:ltr}
.legend{font-size:12.5px;color:var(--muted-foreground);line-height:1.8;margin:0;padding:0 18px}
.legend b{color:var(--foreground);font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <div class="stage">
    <div class="frame"><canvas id="portrait" width="400" height="712"></canvas><span class="cap">عمودي 9:16</span></div>
    <div class="frame"><canvas id="landscape" width="800" height="450"></canvas><span class="cap">أفقي 16:9</span></div>
  </div>
  <div class="bar">
    <button class="primary" id="play">▶ تشغيل مع الصوت</button>
    <button id="sound" aria-pressed="true">🔊 الصوت</button>
    <button id="slow" aria-pressed="false">🐢 ‎0.25×</button>
    <input type="range" id="scrub" min="-600" max="2000" value="2000" step="1">
    <span class="t" id="tl">2.00s</span>
  </div>
  <ul class="legend">
    <li><b>‎−0.6s → 0</b> آخر لقطة من الفيديو، ثم تلاشٍ سريع (0.15s) إلى خلفية نقي</li>
    <li><b>‎0.05s</b> يُرسم قوس الشعار مع صوت «ووش» خفيف</li>
    <li><b>‎0.35s</b> تسقط القطرة في القوس بارتداد بسيط، ومع استقرارها «بوب» ناعم ووهج</li>
    <li><b>‎0.70s</b> يصعد النص العربي ثم الإنجليزي مع لمعة هادئة، والمجموع ثانيتان</li>
  </ul>
</div>
<script>
// Pure function of t (seconds): the same math will be ported to Kotlin Canvas / CoreGraphics.
const BG = '#0C1512', JADE = '#55C3A1', PAPER = '#F5F7F3';
const ARC = new Path2D('M40.64,57.09 A13.36,13.36 0 0 0 67.36,57.09');
const DROP = new Path2D('M49.36,34.31 L49.36,46.97 L61.17,40.64 Z');
const ARC_LEN = Math.PI * 13.36, MARK_CX = 54, MARK_CY = 53.55;
const TOTAL = 2.0, PRE = 0.6;

const clamp = (x) => Math.min(1, Math.max(0, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const outCubic = (x) => 1 - Math.pow(1 - x, 3);
const outBack = (x) => { const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };

function fakeVideo(ctx, w, h, t) {
  const g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, '#7aa6c2'); g.addColorStop(0.6, '#c9b48f'); g.addColorStop(1, '#6b5a43');
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  const s = Math.min(w, h), x = w * 0.5 + Math.sin(t * 3) * s * 0.05;
  ctx.save(); ctx.filter = `blur(${s * 0.04}px)`;
  ctx.fillStyle = '#d8b9a0'; ctx.beginPath(); ctx.arc(x, h * 0.42, s * 0.16, 0, 7); ctx.fill();
  ctx.restore();
}

function drawFrame(ctx, w, h, t) {
  if (t < 0) return fakeVideo(ctx, w, h, t);
  const s = Math.min(w, h);
  ctx.fillStyle = BG; ctx.fillRect(0, 0, w, h);

  // Mark: ~26% of short side, centered a little above middle.
  const unit = (s * 0.26) / 45.7, cx = w / 2, cy = h / 2 - s * 0.09;

  // Glow pulse when the drop lands.
  const glow = seg(t, 0.6, 1.3);
  if (glow > 0) {
    const r = s * (0.18 + 0.12 * outCubic(glow));
    const rg = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
    rg.addColorStop(0, `rgba(85,195,161,${0.22 * (1 - glow * 0.55)})`);
    rg.addColorStop(1, 'rgba(85,195,161,0)');
    ctx.fillStyle = rg; ctx.fillRect(0, 0, w, h);
  }

  ctx.save();
  ctx.translate(cx, cy); ctx.scale(unit, unit); ctx.translate(-MARK_CX, -MARK_CY);
  ctx.strokeStyle = JADE; ctx.fillStyle = JADE; ctx.lineCap = 'round'; ctx.lineJoin = 'round';

  const arc = outCubic(seg(t, 0.05, 0.55));
  if (arc > 0) {
    ctx.lineWidth = 7.88;
    ctx.setLineDash([ARC_LEN * arc, ARC_LEN]);
    ctx.stroke(ARC); ctx.setLineDash([]);
  }

  const d = seg(t, 0.35, 0.7);
  if (d > 0) {
    ctx.save();
    ctx.globalAlpha = clamp(d * 3);
    ctx.translate(0, -18 * (1 - outBack(d)));
    ctx.lineWidth = 3.23; ctx.fill(DROP); ctx.stroke(DROP);
    ctx.restore();
  }
  ctx.restore();

  // Bilingual text.
  const ar = outCubic(seg(t, 0.7, 1.1)), en = outCubic(seg(t, 0.82, 1.22));
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  if (ar > 0) {
    ctx.save(); ctx.globalAlpha = ar; ctx.fillStyle = PAPER; ctx.direction = 'rtl';
    ctx.font = `700 ${s * 0.082}px Thmanyah`;
    ctx.fillText('نُقّي بتطبيق نقي', cx, cy + s * 0.27 + s * 0.04 * (1 - ar));
    ctx.restore();
  }
  if (en > 0) {
    ctx.save(); ctx.globalAlpha = en * 0.62; ctx.fillStyle = PAPER; ctx.direction = 'ltr';
    ctx.font = `500 ${s * 0.046}px Thmanyah`;
    if ('letterSpacing' in ctx) ctx.letterSpacing = `${s * 0.004}px`;
    ctx.fillText('Filtered with Naqi', cx, cy + s * 0.355 + s * 0.04 * (1 - en));
    ctx.restore();
  }

  // Quick fade in from the last video frame.
  const f = seg(t, 0, 0.15);
  if (f < 1) {
    ctx.save(); ctx.globalAlpha = 1 - f; fakeVideo(ctx, w, h, 0); ctx.restore();
  }
}

// --- Sound effects (Web Audio, synthesized; no music) ---
let ac;
function noiseBuf() {
  const b = ac.createBuffer(1, ac.sampleRate, ac.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  return b;
}
function whoosh(at) {
  const n = ac.createBufferSource(); n.buffer = noiseBuf();
  const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.1;
  bp.frequency.setValueAtTime(450, at); bp.frequency.exponentialRampToValueAtTime(2600, at + 0.45);
  const g = ac.createGain(); g.gain.setValueAtTime(0.0001, at);
  g.gain.exponentialRampToValueAtTime(0.22, at + 0.18); g.gain.exponentialRampToValueAtTime(0.0001, at + 0.5);
  n.connect(bp).connect(g).connect(ac.destination); n.start(at); n.stop(at + 0.55);
}
function pop(at) {
  const o = ac.createOscillator(); o.type = 'sine';
  o.frequency.setValueAtTime(560, at); o.frequency.exponentialRampToValueAtTime(230, at + 0.12);
  const g = ac.createGain(); g.gain.setValueAtTime(0.0001, at);
  g.gain.exponentialRampToValueAtTime(0.4, at + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, at + 0.2);
  o.connect(g).connect(ac.destination); o.start(at); o.stop(at + 0.22);
  const n = ac.createBufferSource(); n.buffer = noiseBuf();
  const hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 3500;
  const g2 = ac.createGain(); g2.gain.setValueAtTime(0.07, at); g2.gain.exponentialRampToValueAtTime(0.0001, at + 0.03);
  n.connect(hp).connect(g2).connect(ac.destination); n.start(at); n.stop(at + 0.04);
}
function shimmer(at) {
  const n = ac.createBufferSource(); n.buffer = noiseBuf();
  const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 6;
  bp.frequency.setValueAtTime(5200, at); bp.frequency.exponentialRampToValueAtTime(7800, at + 0.35);
  const g = ac.createGain(); g.gain.setValueAtTime(0.0001, at);
  g.gain.exponentialRampToValueAtTime(0.09, at + 0.05); g.gain.exponentialRampToValueAtTime(0.0001, at + 0.4);
  n.connect(bp).connect(g).connect(ac.destination); n.start(at); n.stop(at + 0.45);
}

// --- Playback ---
const canvases = [...document.querySelectorAll('canvas')].map((c) => [c.getContext('2d'), c.width, c.height]);
const scrub = document.getElementById('scrub'), tl = document.getElementById('tl');
let speed = 1, soundOn = true, start = null, raf = 0;

function render(t) {
  for (const [ctx, w, h] of canvases) drawFrame(ctx, w, h, t);
  scrub.value = Math.round(t * 1000); tl.textContent = t.toFixed(2) + 's';
}
function tick(now) {
  const t = (now - start) / 1000 * speed - PRE;
  render(Math.min(t, TOTAL));
  if (t < TOTAL) raf = requestAnimationFrame(tick);
}
function play() {
  cancelAnimationFrame(raf);
  if (soundOn) {
    ac = ac || new AudioContext(); ac.resume();
    const base = ac.currentTime + 0.03, at = (s) => base + (s + PRE) / speed;
    whoosh(at(0.05)); pop(at(0.62)); shimmer(at(0.72));
  }
  start = performance.now() + 30; raf = requestAnimationFrame(tick);
}
document.getElementById('play').onclick = play;
document.getElementById('sound').onclick = (e) => { soundOn = !soundOn; e.currentTarget.setAttribute('aria-pressed', soundOn); e.currentTarget.textContent = soundOn ? '🔊 الصوت' : '🔇 الصوت'; };
document.getElementById('slow').onclick = (e) => { speed = speed === 1 ? 0.25 : 1; e.currentTarget.setAttribute('aria-pressed', speed !== 1); };
scrub.oninput = () => { cancelAnimationFrame(raf); render(scrub.value / 1000); };
document.fonts.load('700 20px Thmanyah').then(() => document.fonts.load('500 20px Thmanyah')).then(() => render(TOTAL));
</script>
</body>
