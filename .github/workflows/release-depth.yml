# Goes red when desktop releases have pushed the newest Android release out of the 10 newest, the only ones
# older Android builds read (docs/RELEASING.md, "Page depth"). Before publishing a desktop release, run
# `.github/scripts/release-depth.sh 9` by hand: this check only notices once it has happened.
name: Release depth

on:
  release:
    types: [published]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/scripts/release-depth*.sh
      - .github/workflows/release-depth.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # A release's own tag may predate the script.
          ref: ${{ github.event_name == 'release' && github.event.repository.default_branch || '' }}

      - name: Test the guard
        run: .github/scripts/release-depth.test.sh

      - name: Newest Android release within the 10 newest
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/release-depth.sh
