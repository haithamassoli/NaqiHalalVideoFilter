<!doctype html>
<!-- Source for public/og-en.png and public/og-ar.png. Regenerate with ./og/render.sh -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300..700&display=block">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: linear-gradient(160deg, #1E6B58, #08110E 75%);
    color: #F5F7F3; font-family: 'Readex Pro', sans-serif;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 72px 84px; box-sizing: border-box;
  }
  .brand { display: flex; align-items: center; gap: 20px; font-size: 40px; font-weight: 600; }
  .brand img { width: 72px; height: 72px; border-radius: 16px; box-shadow: 0 0 0 2px rgb(245 247 243 / 0.15); }
  h1 { margin: 0; font-size: 88px; line-height: 1.08; font-weight: 650; letter-spacing: -0.02em; }
  [dir=rtl] h1 { letter-spacing: 0; line-height: 1.3; font-size: 84px; }
  svg { width: 100%; height: 64px; display: block; }
  .s { fill: #6FD9B6; } .m { fill: #4b7a6c; }
  p { margin: 0; font-size: 28px; color: #cfe2da; }
</style>
</head>
<body>
  <div class="brand"><img src="../public/favicon.svg" alt=""><span id="brandname"></span></div>
  <h1 id="h"></h1>
  <div>
    <svg id="wave" viewBox="0 0 720 100" preserveAspectRatio="none"></svg>
    <p id="p" style="margin-top:22px"></p>
  </div>
<script>
  const ar = new URLSearchParams(location.search).get('lang') === 'ar';
  document.documentElement.lang = ar ? 'ar' : 'en';
  document.documentElement.dir = ar ? 'rtl' : 'ltr';
  document.getElementById("brandname").textContent = ar ? 'نقي' : 'Naqi';
  h.textContent = ar ? 'أبقِ الكلام، واحذف الموسيقى.' : 'Keep the talk. Lose the music.';
  p.textContent = ar
    ? 'فلترة الفيديو على جهازك. لأندرويد وآيفون وآيباد وماك.'
    : 'On-device video filtering for Android, iPhone, iPad and Mac.';
  // Same wave as the landing page, with the music already flattened.
  wave.innerHTML = Array.from({ length: 72 }, (_, i) => {
    const music = (i >= 10 && i < 28) || (i >= 46 && i < 60);
    const h = music ? 0.07 : 0.15 + 0.7 * Math.abs(Math.sin(i * 1.7) * Math.cos(i * 0.45));
    return `<rect class="${music ? 'm' : 's'}" x="${i * 10 + 2}" y="${50 - h * 48}" width="6" height="${h * 96}" rx="3"/>`;
  }).join('');
</script>
</body>
</html>
