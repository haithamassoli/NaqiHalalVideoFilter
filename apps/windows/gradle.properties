org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
kotlin.code.style=official

# JavaCPP natives to bundle, comma-separated. The default lets one checkout run on Windows and on either Mac;
# a Windows release build passes -Pjavacpp.platform=windows-x86_64 so the MSI carries only its own (each
# platform's GPL FFmpeg is tens of MB).
javacpp.platform=windows-x86_64,macosx-arm64,macosx-x86_64
